<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.C Technical Institute</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="header-placeholder"></div>
    
    <main class="container my-4 text-center flex-grow-1">
        <img src="clg.avif" width="800" height="600"
             class="img-fluid rounded shadow d-block mx-auto"
             alt="R.C Technical Institute">

        <div class="text-center mt-4">
            <h2>Welcome to R.C Technical Institute</h2>
            <p class="lead">
                Welcome to R.C Technical Institute, a place for technical education and learning.
            </p>
        </div>
    </main>

    <!-- Footer Outside Container for Full-Width -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                const temp = document.createElement('div');
                temp.innerHTML = data;

                const header = temp.querySelector('header');
                const footer = temp.querySelector('footer');

                if (header) document.getElementById('header-placeholder').replaceWith(header);
                if (footer) document.getElementById('footer-placeholder').replaceWith(footer);
            })
            .catch(error => console.error('Error loading header/footer:', error));
    </script>
</body>
</html>
