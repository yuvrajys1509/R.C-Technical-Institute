<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Technical - Contact Us</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div id="header-placeholder"></div>

    <div class="container my-5 flex-grow-1">

        <a href="index.html" class="btn btn-primary mb-4">
            ← Back to Home
        </a>

        <!-- Contact Box -->
        <div class="border border-primary border-2 rounded p-4 bg-info-subtle">
            <h2 class="text-primary fw-bold text-center mb-4">Contact Us</h2>
            <p class="mb-3"><strong>📍 Address:</strong><br>R.C. Technical Institute, Ahmedabad, Gujarat, India</p>
            <p class="mb-3"><strong>📞 Phone:</strong><br>+91 XXXXX XXXXX</p>
            <p class="mb-3"><strong>✉ Email:</strong><br>info@rcti.ac.in</p>
            <p class="mb-0"><strong>🌐 Website:</strong><br>www.rcti.ac.in</p>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                const temp = document.createElement('div');
                temp.innerHTML = data;

                const header = temp.querySelector('header');
                const footer = temp.querySelector('footer');

                if (header) document.getElementById('header-placeholder').replaceWith(header);
                if (footer) document.getElementById('footer-placeholder').replaceWith(footer);
            })
            .catch(error => console.error('Error loading header/footer:', error));
    </script>
</body>
</html>
