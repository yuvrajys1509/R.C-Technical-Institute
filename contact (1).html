<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Us - R.C. Technical Institute</title>

    
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <div id="header-placeholder"></div>
    <main class="flex-grow-1">

        <div class="container py-5">
            <div class="text-center mb-5">

                <h1 class="fw-bold">Contact Us</h1>

                <p class="text-muted">
                    Get in touch with R.C. Technical Institute
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-lg-6 col-md-8">

                    <div class="card shadow-sm h-100">

                        <div class="card-body p-4">

                            <h3 class="fw-bold mb-4">
                                College Information
                            </h3>


                            <div class="d-flex mb-4">

                                <i class="bi bi-geo-alt-fill fs-4 text-primary me-3"></i>

                                <div>
                                    <h6 class="fw-bold mb-1">Address</h6>

                                    <p class="text-muted mb-0">
                                        R.C. Technical Institute,<br>
                                        Ahmedabad, Gujarat, India
                                    </p>
                                </div>

                            </div>


                            <div class="d-flex mb-4">

                                <i class="bi bi-telephone-fill fs-4 text-primary me-3"></i>
                                <div>
                                    <h6 class="fw-bold mb-1">Phone</h6>
                                    <p class="text-muted mb-0">
                                        +91 XXXXX XXXXX
                                    </p>
                                </div>
                            </div>
                            <div class="d-flex mb-4">
                                <i class="bi bi-envelope-fill fs-4 text-primary me-3"></i>
                                <div>
                                    <h6 class="fw-bold mb-1">Email</h6>
                                    <p class="text-muted mb-0">
                                        info@rcti.ac.in
                                    </p>
                                </div>
                            </div>
                            <div class="d-flex">
                                <i class="bi bi-clock-fill fs-4 text-primary me-3"></i>
                                <div>
                                    <h6 class="fw-bold mb-1">Office Hours</h6>
                                    <p class="text-muted mb-0">
                                        Monday - Saturday<br>
                                        10:00 AM - 5:00 PM
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
    </main>
    <div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                const temp = document.createElement('div');
                temp.innerHTML = data;

                const header = temp.querySelector('header');
                const footer = temp.querySelector('footer');

                if (header) document.getElementById('header-placeholder').replaceWith(header);
                if (footer) document.getElementById('footer-placeholder').replaceWith(footer);
            })
            .catch(error => console.error('Error loading header/footer:', error));
    </script>

</body>

</html>
